<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泽_瑞的个人空间</title>
    <script src="./supabase.js"></script>
    <script>
        // 已修正：去掉了 /rest/v1/ 后缀
        const SUPABASE_URL = 'https://wqjjwthsfkmylgbddknk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxamp3dGhzZmtteWxnYmRka25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTMyNDgsImV4cCI6MjEwNTk4OTI0OH0.t6SQmbWVxxygVY5GT9nObTLEYAR7x1GwVGvDe_h1qs8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
    <style>
        :root{
            --blue-50:#f0f8ff;
            --blue-100:#e3f2fd;
            --blue-200:#bbdefb;
            --blue-300:#90caf9;
            --blue-500:#42a5f5;
            --blue-700:#1565c0;
            --blue-900:#0d47a1;
            --cyan-50:#e0f7fa;
            --cyan-100:#b2ebf2;
            --cyan-300:#80deea;
            --cyan-500:#26c6da;
            --cyan-700:#00838f;
            --ink:#1b3a4b;
        }
        *{box-sizing:border-box;}
        body{
            margin:0;
            font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
            color:var(--ink);
            min-height:100vh;
            background:
                    radial-gradient(circle at 12% 8%, rgba(178,235,242,.55), transparent 45%),
                    radial-gradient(circle at 88% 92%, rgba(187,222,251,.6), transparent 45%),
                    linear-gradient(160deg, var(--blue-50) 0%, var(--blue-100) 48%, var(--cyan-50) 100%);
            background-attachment:fixed;
        }
        .site-header{ text-align:center; padding:40px 20px 24px; }
        .site-header h1{ margin:0; font-size:clamp(1.7rem, 4vw, 2.4rem); letter-spacing:3px; color:var(--blue-900); text-shadow:0 3px 14px rgba(33,150,243,.22); }
        .site-header .subtitle{ margin:10px 0 0; font-size:.92rem; letter-spacing:6px; color:var(--cyan-700); opacity:.85; }
        .header-line{ width:120px; height:4px; margin:18px auto 0; border-radius:4px; background:linear-gradient(90deg, var(--blue-300), var(--cyan-300)); }
        .layout{ display:grid; grid-template-columns:1fr 1fr; gap:22px; max-width:1300px; margin:0 auto; padding:0 20px 56px; align-items:start; }
        @media (max-width:920px){ .layout{grid-template-columns:1fr;} }
        .panel{ background:rgba(255,255,255,.76); border:1px solid var(--blue-200); border-radius:18px; padding:18px 18px 22px; box-shadow:0 10px 30px rgba(33,150,243,.13); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
        .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; border-bottom:2px dashed var(--blue-200); }
        .panel-head h2{ margin:0; font-size:1.15rem; color:var(--blue-900); display:flex; align-items:center; gap:8px; }
        .panel-head h2::before{ content:""; width:9px;height:22px; border-radius:5px; background:linear-gradient(180deg, var(--blue-500), var(--cyan-500)); }
        .btn{ border:1px solid var(--blue-300); background:var(--blue-100); color:var(--blue-700); padding:7px 15px; border-radius:10px; font-size:13.5px; font-family:inherit; cursor:pointer; transition:all .18s ease; }
        .btn:hover{background:var(--blue-200);transform:translateY(-1px);}
        .btn:active{transform:translateY(0);}
        .btn.primary{ background:var(--blue-500); border-color:var(--blue-500); color:#fff; box-shadow:0 5px 14px rgba(66,165,245,.35); }
        .btn.primary:hover{background:#1e88e5;}
        .btn.ghost{ background:transparent; border-color:var(--cyan-100); color:var(--cyan-700); }
        .btn.ghost:hover{background:var(--cyan-50);}
        .upload-form{ display:flex; flex-direction:column; gap:10px; margin:14px 0 4px; padding:14px; border-radius:14px; background:linear-gradient(135deg, var(--cyan-50), var(--blue-50)); border:1px solid var(--cyan-100); }
        .upload-form.hidden{display:none;}
        .upload-form input[type=text], .upload-form select, .upload-form textarea{ width:100%; padding:10px 12px; border:1px solid var(--blue-200); border-radius:10px; background:#fff; font-size:14px; font-family:inherit; color:var(--ink); outline:none; transition:border-color .18s, box-shadow .18s; }
        .upload-form textarea{ resize:vertical; line-height:1.6; }
        .upload-form input:focus, .upload-form select:focus, .upload-form textarea:focus{ border-color:var(--cyan-500); box-shadow:0 0 0 3px rgba(38,198,218,.18); }
        .upload-form textarea[name=code]{ font-family:"Consolas","Courier New",monospace; background:#fbfdff; }
        .form-actions{ display:flex; gap:10px; justify-content:flex-end; }
        .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; }
        .tab{ border:1px solid var(--cyan-100); background:var(--cyan-50); color:var(--cyan-700); padding:6px 16px; border-radius:999px; font-size:13.5px; font-family:inherit; cursor:pointer; transition:all .18s ease; }
        .tab:hover{background:var(--cyan-100);}
        .tab.active{ background:var(--cyan-500); border-color:var(--cyan-500); color:#fff; box-shadow:0 5px 14px rgba(38,198,218,.35); }
        .list{margin-top:14px;}
        .item{ background:#fff; border:1px solid var(--blue-100); border-left:4px solid var(--cyan-300); border-radius:12px; padding:13px 15px; margin-bottom:11px; transition:box-shadow .18s, transform .18s; }
        .item:hover{ box-shadow:0 8px 20px rgba(33,150,243,.14); transform:translateY(-1px); }
        .item-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
        .item-head h3{ margin:0; font-size:15px; color:var(--blue-900); line-height:1.45; word-break:break-word; }
        .item-actions{ display:flex; gap:6px; flex-shrink:0; }
        .icon-btn{ border:1px solid var(--blue-200); background:var(--blue-50); color:var(--blue-700); font-size:12px; font-family:inherit; padding:4px 10px; border-radius:8px; cursor:pointer; transition:all .16s; }
        .icon-btn:hover{background:var(--blue-100);}
        .icon-btn.danger{color:#c62828;border-color:#ffcdd2;background:#fff5f5;}
        .icon-btn.danger:hover{background:#ffebee;}
        .meta{ margin-top:8px; font-size:12px; color:#7a96a8; letter-spacing:.5px; }
        pre.code{ margin:10px 0 0; padding:13px 15px; background:#0f2233; color:#a8d8ff; border-radius:10px; overflow:auto; max-height:280px; font-size:12.8px; line-height:1.62; font-family:"Consolas","Courier New",monospace; white-space:pre; tab-size:4; }
        pre.code::-webkit-scrollbar{height:8px;width:8px;}
        pre.code::-webkit-scrollbar-thumb{background:#2c4a63;border-radius:8px;}
        .article-summary{ margin:9px 0 0; font-size:13.5px; line-height:1.75; color:#41627a; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
        .badge{ display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--cyan-50); color:var(--cyan-700); border:1px solid var(--cyan-100); margin-right:8px; vertical-align:middle; }
        .empty{ text-align:center; color:#8fa9ba; font-size:13.5px; padding:26px 10px; border:1px dashed var(--blue-200); border-radius:12px; background:rgba(255,255,255,.5); }
        .modal{ position:fixed; inset:0; background:rgba(13,71,161,.32); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:22px; z-index:80; }
        .modal.hidden{display:none;}
        .modal-box{ background:#fff; border-radius:18px; border-top:6px solid var(--cyan-500); box-shadow:0 24px 60px rgba(13,71,161,.3); width:100%; max-width:840px; max-height:86vh; display:flex; flex-direction:column; overflow:hidden; }
        .modal-head{ padding:20px 24px 14px; border-bottom:1px solid var(--blue-100); }
        .modal-head h3{ margin:0 0 6px; font-size:1.15rem; color:var(--blue-900); word-break:break-word; }
        .modal-body{ padding:20px 24px 26px; overflow:auto; font-size:14.5px; line-height:2; color:#2c4a5e; white-space:pre-wrap; word-break:break-word; }
        .modal-foot{ padding:12px 24px 18px; text-align:right; border-top:1px solid var(--blue-100); }
        .toast{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); background:rgba(13,71,161,.92); color:#fff; font-size:13.5px; padding:10px 22px; border-radius:999px; opacity:0; pointer-events:none; transition:all .28s ease; z-index:99; }
        .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header class="site-header">
    <h1>泽_瑞的个人空间</h1>
    <p class="subtitle">代码模板 · 优秀文章</p>
    <div class="header-line"></div>
</header>

<main class="layout">
    <!-- 代码模板 -->
    <section class="panel">
        <div class="panel-head">
            <h2>代码模板</h2>
            <button class="btn" id="toggleCodeForm">+ 上传代码</button>
        </div>
        <form class="upload-form hidden" id="codeForm">
            <input type="text" id="codeName" placeholder="模板名称，例如：快速排序 / 并查集 / 线段树" maxlength="80" required>
            <textarea id="codeBody" rows="9" placeholder="在此粘贴 C++ 代码..." required></textarea>
            <div class="form-actions">
                <button type="button" class="btn ghost" data-cancel="codeForm">取消</button>
                <button type="submit" class="btn primary">保存模板</button>
            </div>
        </form>
        <div class="list" id="codeList"></div>
    </section>

    <!-- 优秀文章 -->
    <section class="panel">
        <div class="panel-head">
            <h2>优秀文章</h2>
            <button class="btn" id="toggleArticleForm">+ 上传文章</button>
        </div>
        <div class="tabs" id="tabs">
            <button class="tab active" data-cat="男同">男同</button>
            <button class="tab" data-cat="百合">百合</button>
            <button class="tab" data-cat="色情">色情</button>
            <button class="tab" data-cat="科幻">科幻</button>
        </div>
        <form class="upload-form hidden" id="articleForm">
            <select id="articleCat">
                <option value="男同">男同</option>
                <option value="百合">百合</option>
                <option value="色情">色情</option>
                <option value="科幻">科幻</option>
            </select>
            <input type="text" id="articleTitle" placeholder="文章标题" maxlength="120" required>
            <textarea id="articleBody" rows="9" placeholder="在此粘贴文章正文..." required></textarea>
            <div class="form-actions">
                <button type="button" class="btn ghost" data-cancel="articleForm">取消</button>
                <button type="submit" class="btn primary">保存文章</button>
            </div>
        </form>
        <div class="list" id="articleList"></div>
    </section>
</main>

<div class="modal hidden" id="modal">
    <div class="modal-box">
        <div class="modal-head">
            <h3 id="modalTitle"></h3>
            <div class="meta" id="modalMeta"></div>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot">
            <button class="btn" id="modalClose">关闭</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    /* ================= 工具函数 ================= */
    const $ = s => document.querySelector(s);
    const state = { codes: [], articles: [], category: '男同' };
    let toastTimer = null;

    function esc(str){
        return String(str ?? '').replace(/[&<>"']/g, c => (
            {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
        ));
    }
    function toast(msg){
        const el = $('#toast'); el.textContent = msg; el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }
    function fmtDate(){
        const d = new Date(); const p = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    /* ================= 代码模板 ================= */
    async function loadCodes(){
        try {
            const { data, error } = await supabase.from('codes').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            state.codes = data || [];
            renderCodes();
        } catch(e){ toast('加载代码失败: ' + e.message); }
    }

    function renderCodes(){
        const box = $('#codeList');
        if (!state.codes.length){
            box.innerHTML = '<p class="empty">还没有代码模板，点右上角「上传代码」添加第一个吧～</p>';
            return;
        }
        box.innerHTML = state.codes.map(item => `
            <article class="item">
                <div class="item-head"><h3>${esc(item.name)}</h3>
                <div class="item-actions">
                    <button class="icon-btn" data-copy="${esc(item.id)}">复制</button>
                    <button class="icon-btn danger" data-del-code="${esc(item.id)}">删除</button>
                </div></div>
                <pre class="code"><code>${esc(item.code)}</code></pre>
                <div class="meta">${esc(item.created_at)}</div>
            </article>`).join('');
    }

    $('#codeList').addEventListener('click', async (e) => {
        const t = e.target;
        if (t.dataset.copy){
            const item = state.codes.find(c => c.id === t.dataset.copy);
            if (!item) return;
            try { await navigator.clipboard.writeText(item.code); toast('代码已复制'); } catch(err){ toast('复制失败'); }
            return;
        }
        if (t.dataset.delCode){
            if (!confirm('确定删除吗？')) return;
            const { error } = await supabase.from('codes').delete().eq('id', t.dataset.delCode);
            if (!error) { toast('已删除'); await loadCodes(); } else { toast(error.message); }
        }
    });

    $('#toggleCodeForm').addEventListener('click', () => $('#codeForm').classList.toggle('hidden'));
    $('#codeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = $('#codeName').value.trim(); const code = $('#codeBody').value.trim();
        if (!name || !code){ toast('名称和代码不能为空'); return; }
        const { error } = await supabase.from('codes').insert([{ id: genId(), name, code, created_at: fmtDate() }]);
        if (!error) { e.target.reset(); e.target.classList.add('hidden'); toast('模板已保存'); await loadCodes(); } else { toast(error.message); }
    });

    /* ================= 文章 ================= */
    async function loadArticles(){
        try {
            const { data, error } = await supabase.from('articles').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            state.articles = data || [];
            renderArticles();
        } catch(e){ toast('加载文章失败: ' + e.message); }
    }

    function renderArticles(){
        const box = $('#articleList');
        const list = state.articles.filter(a => a.category === state.category);
        if (!list.length){ box.innerHTML = `<p class="empty">「${esc(state.category)}」分类下还没有文章</p>`; return; }
        box.innerHTML = list.map(item => {
            const preview = (item.content || '').replace(/\s+/g, ' ').slice(0, 140);
            return `<article class="item">
                <div class="item-head"><h3><span class="badge">${esc(item.category)}</span>${esc(item.title)}</h3>
                <div class="item-actions">
                    <button class="icon-btn" data-read="${esc(item.id)}">阅读</button>
                    <button class="icon-btn danger" data-del-article="${esc(item.id)}">删除</button>
                </div></div>
                <p class="article-summary">${esc(preview)}${(item.content||'').length > 140 ? '…' : ''}</p>
                <div class="meta">${esc(item.created_at)}</div>
            </article>`;
        }).join('');
    }

    $('#tabs').addEventListener('click', (e) => {
        const tab = e.target.closest('.tab'); if (!tab) return;
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        tab.classList.add('active'); state.category = tab.dataset.cat; $('#articleCat').value = state.category; renderArticles();
    });

    $('#articleList').addEventListener('click', async (e) => {
        const t = e.target;
        if (t.dataset.read){
            const item = state.articles.find(a => a.id === t.dataset.read);
            if (item) { $('#modalTitle').textContent = item.title; $('#modalMeta').textContent = `${item.category} · ${item.created_at}`; $('#modalBody').textContent = item.content; $('#modal').classList.remove('hidden'); }
            return;
        }
        if (t.dataset.delArticle){
            if (!confirm('确定删除这篇文章吗？')) return;
            const { error } = await supabase.from('articles').delete().eq('id', t.dataset.delArticle);
            if (!error) { toast('已删除'); await loadArticles(); } else { toast(error.message); }
        }
    });

    $('#toggleArticleForm').addEventListener('click', () => { $('#articleCat').value = state.category; $('#articleForm').classList.toggle('hidden'); });
    $('#articleForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const category = $('#articleCat').value; const title = $('#articleTitle').value.trim(); const content = $('#articleBody').value.trim();
        if (!title || !content){ toast('标题和正文不能为空'); return; }
        const { error } = await supabase.from('articles').insert([{ id: genId(), category, title, content, created_at: fmtDate() }]);
        if (!error) { e.target.reset(); $('#articleCat').value = state.category; e.target.classList.add('hidden'); toast('文章已保存'); await loadArticles(); } else { toast(error.message); }
    });

    /* ================= 弹窗与取消 ================= */
    $('#modalClose').addEventListener('click', () => $('#modal').classList.add('hidden'));
    $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('#modal').classList.add('hidden'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#modal').classList.add('hidden'); });
    document.querySelectorAll('[data-cancel]').forEach(btn => {
        btn.addEventListener('click', () => { const form = document.getElementById(btn.dataset.cancel); form.reset(); form.classList.add('hidden'); });
    });

    /* ================= 初始化 ================= */
    (async function init(){ state.category = document.querySelector('.tab.active').dataset.cat; await Promise.all([loadCodes(), loadArticles()]); })();
</script>
</body>
</html>
