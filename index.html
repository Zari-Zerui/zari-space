<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泽_瑞的个人空间</title>
    <script src="./supabase.js"></script>
    <script>
        const SUPABASE_URL = 'https://wqjjwthsfkmylgbddknk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indxamp3dGhzZmtteWxnYmRka25rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTMyNDgsImV4cCI6MjEwNTk4OTI0OH0.t6SQmbWVxxygVY5GT9nObTLEYAR7x1GwVGvDe_h1qs8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
    <style>
        :root{
            --blue-50:#f0f8ff; --blue-100:#e3f2fd; --blue-200:#bbdefb; --blue-300:#90caf9;
            --blue-500:#42a5f5; --blue-700:#1565c0; --blue-900:#0d47a1;
            --cyan-50:#e0f7fa; --cyan-100:#b2ebf2; --cyan-300:#80deea; --cyan-500:#26c6da; --cyan-700:#00838f;
            --ink:#1b3a4b;
        }
        *{box-sizing:border-box;}
        body{
            margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; color:var(--ink);
            min-height:100vh; background: radial-gradient(circle at 12% 8%, rgba(178,235,242,.55), transparent 45%),
            radial-gradient(circle at 88% 92%, rgba(187,222,251,.6), transparent 45%),
            linear-gradient(160deg, var(--blue-50) 0%, var(--blue-100) 48%, var(--cyan-50) 100%);
            background-attachment:fixed;
        }
        
        /* 登录遮罩层样式 */
        #loginOverlay { position:fixed; inset:0; background:rgba(13,71,161,.6); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .login-box { background:#fff; padding:30px 40px 40px; border-radius:18px; width:100%; max-width:420px; text-align:center; border-top:6px solid var(--cyan-500); box-shadow:0 24px 60px rgba(13,71,161,.4); }
        .login-box h2 { margin:0 0 20px; color:var(--blue-900); }
        
        /* 切换 Tab */
        .auth-tabs { display:flex; margin-bottom:20px; border-bottom:1px solid var(--blue-100); }
        .auth-tab { flex:1; padding:10px; font-size:15px; cursor:pointer; color:#888; border-bottom:3px solid transparent; transition:all .2s; }
        .auth-tab.active { color:var(--cyan-700); border-bottom-color:var(--cyan-500); font-weight:bold; }
        
        .login-box input { width:100%; padding:12px; margin-bottom:14px; border:1px solid var(--blue-200); border-radius:10px; font-size:14px; outline:none; }
        .login-box input:focus { border-color:var(--cyan-500); box-shadow:0 0 0 3px rgba(38,198,218,.18); }
        
        /* 主界面样式 */
        .hidden { display:none !important; }
        .site-header{ text-align:center; padding:30px 20px 20px; position:relative; }
        .site-header h1{ margin:0; font-size:clamp(1.7rem, 4vw, 2.4rem); letter-spacing:3px; color:var(--blue-900); }
        .site-header .subtitle{ margin:10px 0 0; font-size:.92rem; letter-spacing:6px; color:var(--cyan-700); }
        .header-line{ width:120px; height:4px; margin:18px auto 0; border-radius:4px; background:linear-gradient(90deg, var(--blue-300), var(--cyan-300)); }
        
        /* 用户信息栏 */
        .user-bar { position:absolute; right:20px; top:30px; display:flex; gap:10px; align-items:center; }
        .user-bar span { font-size:14px; color:var(--blue-700); font-weight:bold; }

        /* 布局与面板 */
        .layout{ display:grid; grid-template-columns:1fr 1fr; gap:22px; max-width:1300px; margin:0 auto; padding:0 20px 56px; }
        @media (max-width:920px){ .layout{grid-template-columns:1fr;} }
        .panel{ background:rgba(255,255,255,.76); border:1px solid var(--blue-200); border-radius:18px; padding:18px 18px 22px; box-shadow:0 10px 30px rgba(33,150,243,.13); backdrop-filter:blur(8px); }
        .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; border-bottom:2px dashed var(--blue-200); }
        .panel-head h2{ margin:0; font-size:1.15rem; color:var(--blue-900); display:flex; align-items:center; gap:8px; }
        .panel-head h2::before{ content:""; width:9px;height:22px; border-radius:5px; background:linear-gradient(180deg, var(--blue-500), var(--cyan-500)); }
        
        /* 按钮 */
        .btn{ border:1px solid var(--blue-300); background:var(--blue-100); color:var(--blue-700); padding:7px 15px; border-radius:10px; font-size:13.5px; cursor:pointer; transition:all .18s; }
        .btn:hover{ background:var(--blue-200); transform:translateY(-1px); }
        .btn.primary{ background:var(--blue-500); border-color:var(--blue-500); color:#fff; box-shadow:0 5px 14px rgba(66,165,245,.35); }
        .btn.primary:hover{ background:#1e88e5; }
        .btn.ghost{ background:transparent; border-color:var(--cyan-100); color:var(--cyan-700); }
        .btn.ghost:hover{ background:var(--cyan-50); }
        .btn.danger{ background:#fff5f5; border-color:#ffcdd2; color:#c62828; }
        .btn.danger:hover{ background:#ffebee; }

        /* 表单与列表 */
        .upload-form{ display:flex; flex-direction:column; gap:10px; margin:14px 0 4px; padding:14px; border-radius:14px; background:linear-gradient(135deg, var(--cyan-50), var(--blue-50)); border:1px solid var(--cyan-100); }
        .upload-form input, .upload-form select, .upload-form textarea { width:100%; padding:10px; border:1px solid var(--blue-200); border-radius:10px; font-size:14px; outline:none; }
        .upload-form textarea { resize:vertical; line-height:1.6; font-family:monospace; }
        .form-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }
        
        .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; }
        .tab{ border:1px solid var(--cyan-100); background:var(--cyan-50); color:var(--cyan-700); padding:6px 16px; border-radius:999px; font-size:13.5px; cursor:pointer; }
        .tab.active{ background:var(--cyan-500); border-color:var(--cyan-500); color:#fff; }
        
        .list{margin-top:14px;}
        .item{ background:#fff; border:1px solid var(--blue-100); border-left:4px solid var(--cyan-300); border-radius:12px; padding:13px 15px; margin-bottom:11px; }
        .item-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
        .item-head h3{ margin:0; font-size:15px; color:var(--blue-900); word-break:break-word; }
        .item-actions{ display:flex; gap:6px; flex-shrink:0; }
        .icon-btn{ border:1px solid var(--blue-200); background:var(--blue-50); color:var(--blue-700); font-size:12px; padding:4px 10px; border-radius:8px; cursor:pointer; }
        .icon-btn:hover{ background:var(--blue-100); }
        .icon-btn.danger{ color:#c62828; border-color:#ffcdd2; background:#fff5f5; }
        
        pre.code{ margin:10px 0 0; padding:13px; background:#0f2233; color:#a8d8ff; border-radius:10px; overflow:auto; max-height:280px; font-size:12.8px; font-family:monospace; white-space:pre; }
        .article-summary{ margin:9px 0 0; font-size:13.5px; line-height:1.75; color:#41627a; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
        .badge{ display:inline-block; font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--cyan-50); color:var(--cyan-700); border:1px solid var(--cyan-100); margin-right:8px; }
        .meta{ margin-top:8px; font-size:12px; color:#7a96a8; }
        .empty{ text-align:center; color:#8fa9ba; font-size:13.5px; padding:26px; border:1px dashed var(--blue-200); border-radius:12px; }

        /* 弹窗 */
        .modal{ position:fixed; inset:0; background:rgba(13,71,161,.32); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:22px; z-index:90; }
        .modal-box{ background:#fff; border-radius:18px; border-top:6px solid var(--cyan-500); box-shadow:0 24px 60px rgba(13,71,161,.3); width:100%; max-width:500px; padding:24px; }
        .modal-box h3{ margin:0 0 15px; color:var(--blue-900); }
        .modal-box input, .modal-box select { width:100%; padding:10px; margin-bottom:12px; border:1px solid var(--blue-200); border-radius:10px; outline:none; }
        .modal-box .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:15px; }
        
        .toast{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%); background:rgba(13,71,161,.92); color:#fff; font-size:13.5px; padding:10px 22px; border-radius:999px; opacity:0; pointer-events:none; transition:all .28s; z-index:99; }
        .toast.show{ opacity:1; transform:translateX(-50%) translateY(-10px); }
    </style>
</head>
<body>

<!-- ================= 1. 登录/注册遮罩层 ================= -->
<div id="loginOverlay">
    <div class="login-box">
        <h2>泽_瑞的个人空间</h2>
        
        <div class="auth-tabs">
            <div class="auth-tab active" id="tabLogin">登录</div>
            <div class="auth-tab" id="tabRegister">注册</div>
        </div>

        <!-- 登录表单 -->
        <div id="loginForm">
            <input type="text" id="loginAccount" placeholder="用户名 或 邮箱">
            <input type="password" id="loginPassword" placeholder="密码">
            <button class="btn primary" style="width:100%; padding:12px; margin-top:10px;" id="loginBtn">Log In</button>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="hidden">
            <input type="text" id="regUsername" placeholder="设置用户名 (唯一)">
            <input type="email" id="regEmail" placeholder="绑定邮箱 (用于找回/唯一)">
            <input type="password" id="regPassword" placeholder="设置密码">
            <button class="btn primary" style="width:100%; padding:12px; margin-top:10px;" id="registerBtn">立即注册</button>
        </div>
    </div>
</div>

<!-- ================= 2. 主界面 ================= -->
<div id="mainApp" class="hidden">
    <header class="site-header">
        <div class="user-bar">
            <span id="currentUserLabel"></span>
            <button class="btn ghost" id="profileBtn">个人设置</button>
            <button class="btn ghost" id="manageUsersBtn">用户管理</button>
            <button class="btn danger" id="logoutBtn">退出</button>
        </div>
        <h1>泽_瑞的个人空间</h1>
        <p class="subtitle">代码模板 · 优秀文章</p>
        <div class="header-line"></div>
    </header>

    <main class="layout">
        <!-- 代码模板 -->
        <section class="panel">
            <div class="panel-head">
                <h2>代码模板</h2>
                <button class="btn" id="toggleCodeForm">+ 上传代码</button>
            </div>
            <form class="upload-form hidden" id="codeForm">
                <input type="text" id="codeName" placeholder="模板名称" maxlength="80" required>
                <textarea id="codeBody" rows="6" placeholder="在此粘贴 C++ 代码..." required></textarea>
                <div class="form-actions">
                    <button type="button" class="btn ghost" data-cancel="codeForm">取消</button>
                    <button type="submit" class="btn primary">保存模板</button>
                </div>
            </form>
            <div class="list" id="codeList"></div>
        </section>

        <!-- 优秀文章 -->
        <section class="panel">
            <div class="panel-head">
                <h2>优秀文章</h2>
                <button class="btn" id="toggleArticleForm">+ 上传文章</button>
            </div>
            <div class="tabs" id="tabs">
                <button class="tab active" data-cat="男同">男同</button>
                <button class="tab" data-cat="百合">百合</button>
                <button class="tab" data-cat="色情">色情</button>
                <button class="tab" data-cat="科幻">科幻</button>
            </div>
            <form class="upload-form hidden" id="articleForm">
                <select id="articleCat">
                    <option value="男同">男同</option>
                    <option value="百合">百合</option>
                    <option value="色情">色情</option>
                    <option value="科幻">科幻</option>
                </select>
                <input type="text" id="articleTitle" placeholder="文章标题" maxlength="120" required>
                <textarea id="articleBody" rows="6" placeholder="在此粘贴文章正文..." required></textarea>
                <div class="form-actions">
                    <button type="button" class="btn ghost" data-cancel="articleForm">取消</button>
                    <button type="submit" class="btn primary">保存文章</button>
                </div>
            </form>
            <div class="list" id="articleList"></div>
        </section>
    </main>
</div>

<!-- ================= 3. 阅读弹窗 ================= -->
<div class="modal hidden" id="readModal" style="z-index:95;">
    <div class="modal-box">
        <h3 id="modalTitle"></h3>
        <div class="meta" id="modalMeta" style="margin-bottom:10px;"></div>
        <div id="modalBody" style="max-height:50vh; overflow:auto; white-space:pre-wrap; line-height:1.8;"></div>
        <div class="actions"><button class="btn" id="modalClose">关闭</button></div>
    </div>
</div>

<!-- ================= 4. 个人设置弹窗 ================= -->
<div class="modal hidden" id="profileModal">
    <div class="modal-box">
        <h3>个人设置</h3>
        <label style="font-size:13px; color:var(--blue-700);">用户名</label>
        <input type="text" id="profileUsername">
        <label style="font-size:13px; color:var(--blue-700);">邮箱</label>
        <input type="email" id="profileEmail">
        <label style="font-size:13px; color:var(--blue-700);">新密码 (不修改请留空)</label>
        <input type="password" id="profilePassword" placeholder="留空则不修改">
        <div class="actions">
            <button class="btn ghost" onclick="document.getElementById('profileModal').classList.add('hidden')">取消</button>
            <button class="btn primary" id="saveProfileBtn">保存修改</button>
        </div>
    </div>
</div>

<!-- ================= 5. 用户管理弹窗 (仅超管) ================= -->
<div class="modal hidden" id="manageUsersModal">
    <div class="modal-box" style="max-width:600px;">
        <h3>用户管理</h3>
        <div style="margin-bottom:20px; border-bottom:1px solid var(--blue-100); padding-bottom:15px;">
            <h4 style="margin:0 0 10px; color:var(--cyan-700);">强制注册新用户</h4>
            <input type="text" id="newUserUsername" placeholder="用户名">
            <input type="email" id="newUserEmail" placeholder="邮箱">
            <input type="password" id="newUserPassword" placeholder="密码">
            <select id="newUserType">
                <option value="user">普通用户 (user)</option>
                <option value="admin">管理员 (admin)</option>
            </select>
            <button class="btn primary" style="width:100%;" id="registerUserBtn">注册</button>
        </div>
        <div id="userListContainer" style="max-height:30vh; overflow:auto;"></div>
        <div class="actions"><button class="btn" onclick="document.getElementById('manageUsersModal').classList.add('hidden')">关闭</button></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    /* ================= 全局状态与工具 ================= */
    const $ = s => document.querySelector(s);
    const state = { codes: [], articles: [], category: '男同', currentUser: null };
    let toastTimer = null;

    function esc(str){ return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2500); }
    function fmtDate(){ const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
    function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    // 处理 Supabase 重复键报错
    function handleSupabaseError(error) {
        if (error.message.includes('unique constraint')) {
            if (error.message.includes('email')) return '该邮箱已被注册！';
            if (error.message.includes('username')) return '该用户名已被占用！';
            return '用户名或邮箱已存在！';
        }
        return error.message;
    }

    /* ================= 登录/注册 UI 逻辑 ================= */
    $('#tabLogin').addEventListener('click', () => {
        $('#tabLogin').classList.add('active'); $('#tabRegister').classList.remove('active');
        $('#loginForm').classList.remove('hidden'); $('#registerForm').classList.add('hidden');
    });
    $('#tabRegister').addEventListener('click', () => {
        $('#tabRegister').classList.add('active'); $('#tabLogin').classList.remove('active');
        $('#registerForm').classList.remove('hidden'); $('#loginForm').classList.add('hidden');
    });

    /* ================= 登录逻辑 (支持用户名或邮箱) ================= */
    async function login() {
        const account = $('#loginAccount').value.trim();
        const pwd = $('#loginPassword').value.trim();
        if (!account || !pwd) return toast('请输入账号和密码');

        // Supabase .or() 可以同时匹配多个条件
        const { data, error } = await supabase.from('users')
            .select('*')
            .or(`username.eq.${account},email.eq.${account}`)
            .eq('password', pwd)
            .maybeSingle(); // 用 maybeSingle 防报错
        
        if (error) return toast(error.message);
        if (!data) return toast('账号或密码错误');

        state.currentUser = data;
        localStorage.setItem('zari_uid', data.uid);
        enterMainApp();
        toast('登录成功');
    }

    /* ================= 注册逻辑 (默认user) ================= */
    async function register() {
        const username = $('#regUsername').value.trim();
        const email = $('#regEmail').value.trim();
        const password = $('#regPassword').value.trim();
        
        if (!username || !email || !password) return toast('请填写完整信息');

        // 强制指定 type 为 'user'
        const { error } = await supabase.from('users').insert([{ 
            type: 'user', username, email, password, created_at: fmtDate() 
        }]);

        if (error) return toast(handleSupabaseError(error));
        
        toast('注册成功，请登录');
        $('#tabLogin').click();
        $('#loginAccount').value = username;
    }

    $('#loginBtn').addEventListener('click', login);
    $('#registerBtn').addEventListener('click', register);
    $('#loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('#regPassword').addEventListener('keydown', e => { if (e.key === 'Enter') register(); });

    /* ================= 进入/退出 ================= */
    function logout() {
        localStorage.removeItem('zari_uid');
        state.currentUser = null;
        $('#mainApp').classList.add('hidden');
        $('#loginOverlay').classList.remove('hidden');
        $('#loginAccount').value = '';
        $('#loginPassword').value = '';
    }

    function enterMainApp() {
        $('#loginOverlay').classList.add('hidden');
        $('#mainApp').classList.remove('hidden');
        $('#currentUserLabel').textContent = `${state.currentUser.username}`;
        
        if (state.currentUser.type === 'superadmin') {
            $('#manageUsersBtn').classList.remove('hidden');
        } else {
            $('#manageUsersBtn').classList.add('hidden');
        }

        if (state.currentUser.type === 'user') {
            $('#toggleCodeForm').classList.add('hidden');
            $('#toggleArticleForm').classList.add('hidden');
        } else {
            $('#toggleCodeForm').classList.remove('hidden');
            $('#toggleArticleForm').classList.remove('hidden');
        }

        loadCodes(); loadArticles();
    }
    $('#logoutBtn').addEventListener('click', logout);

    /* ================= 数据加载与渲染 ================= */
    async function loadCodes(){
        const { data, error } = await supabase.from('codes').select('*').order('created_at', { ascending: false });
        if (!error) { state.codes = data || []; renderCodes(); }
    }
    function renderCodes(){
        const box = $('#codeList');
        if (!state.codes.length) { box.innerHTML = '<p class="empty">还没有代码模板</p>'; return; }
        const canDelete = state.currentUser.type !== 'user';
        box.innerHTML = state.codes.map(item => `
            <article class="item">
                <div class="item-head"><h3>${esc(item.name)}</h3>
                <div class="item-actions">
                    <button class="icon-btn" data-copy="${esc(item.id)}">复制</button>
                    ${canDelete ? `<button class="icon-btn danger" data-del-code="${esc(item.id)}">删除</button>` : ''}
                </div></div>
                <pre class="code"><code>${esc(item.code)}</code></pre>
                <div class="meta">${esc(item.created_at)}</div>
            </article>`).join('');
    }

    async function loadArticles(){
        const { data, error } = await supabase.from('articles').select('*').order('created_at', { ascending: false });
        if (!error) { state.articles = data || []; renderArticles(); }
    }
    function renderArticles(){
        const box = $('#articleList');
        const list = state.articles.filter(a => a.category === state.category);
        if (!list.length) { box.innerHTML = `<p class="empty">「${esc(state.category)}」分类下还没有文章</p>`; return; }
        const canDelete = state.currentUser.type !== 'user';
        box.innerHTML = list.map(item => {
            const preview = (item.content || '').replace(/\s+/g, ' ').slice(0, 100);
            return `<article class="item">
                <div class="item-head"><h3><span class="badge">${esc(item.category)}</span>${esc(item.title)}</h3>
                <div class="item-actions">
                    <button class="icon-btn" data-read="${esc(item.id)}">阅读</button>
                    ${canDelete ? `<button class="icon-btn danger" data-del-article="${esc(item.id)}">删除</button>` : ''}
                </div></div>
                <p class="article-summary">${esc(preview)}${(item.content||'').length > 100 ? '…' : ''}</p>
                <div class="meta">${esc(item.created_at)}</div>
            </article>`;
        }).join('');
    }

    /* ================= 个人资料修改 ================= */
    $('#profileBtn').addEventListener('click', () => {
        $('#profileUsername').value = state.currentUser.username;
        $('#profileEmail').value = state.currentUser.email || '';
        $('#profilePassword').value = '';
        $('#profileModal').classList.remove('hidden');
    });

    $('#saveProfileBtn').addEventListener('click', async () => {
        const username = $('#profileUsername').value.trim();
        const email = $('#profileEmail').value.trim();
        const newPassword = $('#profilePassword').value.trim();
        
        if (!username || !email) return toast('用户名和邮箱不能为空');

        const updates = { username, email };
        if (newPassword) updates.password = newPassword;

        const { error } = await supabase.from('users').update(updates).eq('uid', state.currentUser.uid);
        if (error) return toast(handleSupabaseError(error));

        state.currentUser.username = username;
        state.currentUser.email = email;
        if (newPassword) state.currentUser.password = newPassword;
        
        $('#currentUserLabel').textContent = `${state.currentUser.username}`;
        $('#profileModal').classList.add('hidden');
        toast('资料已更新');
    });

    /* ================= 超管管理用户 ================= */
    $('#manageUsersBtn').addEventListener('click', async () => {
        $('#manageUsersModal').classList.remove('hidden');
        await loadUserList();
    });

    async function loadUserList() {
        const { data, error } = await supabase.from('users').select('*').order('uid', { ascending: true });
        if (error) return toast('加载失败');
        const container = $('#userListContainer');
        container.innerHTML = data.map(u => `
            <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:13px;">
                <span>UID: ${u.uid} | <b>${esc(u.username)}</b> (${u.type})<br><span style="color:#888">${esc(u.email||'无邮箱')}</span></span>
                ${u.type !== 'superadmin' ? `<button class="btn danger" style="padding:2px 8px; font-size:12px;" onclick="deleteUser(${u.uid})">删除</button>` : ''}
            </div>
        `).join('');
    }

    $('#registerUserBtn').addEventListener('click', async () => {
        const username = $('#newUserUsername').value.trim();
        const email = $('#newUserEmail').value.trim();
        const password = $('#newUserPassword').value.trim();
        const type = $('#newUserType').value;
        
        if (!username || !email || !password) return toast('请填写完整');

        const { error } = await supabase.from('users').insert([{ type, username, email, password, created_at: fmtDate() }]);
        if (error) return toast(handleSupabaseError(error));
        
        toast('注册成功');
        $('#newUserUsername').value = ''; $('#newUserEmail').value = ''; $('#newUserPassword').value = '';
        await loadUserList();
    });

    window.deleteUser = async (uid) => {
        if (!confirm('确定删除该用户吗？')) return;
        const { error } = await supabase.from('users').delete().eq('uid', uid);
        if (!error) { toast('已删除'); await loadUserList(); }
    };

    /* ================= 文章/代码操作 ================= */
    $('#tabs').addEventListener('click', (e) => {
        const tab = e.target.closest('.tab'); if (!tab) return;
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        tab.classList.add('active'); state.category = tab.dataset.cat; renderArticles();
    });

    $('#articleList').addEventListener('click', (e) => {
        if (e.target.dataset.read) {
            const item = state.articles.find(a => a.id === e.target.dataset.read);
            if (item) {
                $('#modalTitle').textContent = item.title;
                $('#modalMeta').textContent = `${item.category} · ${item.created_at}`;
                $('#modalBody').textContent = item.content;
                $('#readModal').classList.remove('hidden');
            }
        }
    });
    $('#modalClose').addEventListener('click', () => $('#readModal').classList.add('hidden'));

    $('#codeList').addEventListener('click', async (e) => {
        if (e.target.dataset.delCode) {
            if (!confirm('确定删除吗？')) return;
            await supabase.from('codes').delete().eq('id', e.target.dataset.delCode);
            toast('已删除'); await loadCodes();
        }
        if (e.target.dataset.copy) {
            const item = state.codes.find(c => c.id === e.target.dataset.copy);
            if (item) { navigator.clipboard.writeText(item.code); toast('已复制'); }
        }
    });

    $('#articleList').addEventListener('click', async (e) => {
        if (e.target.dataset.delArticle) {
            if (!confirm('确定删除吗？')) return;
            await supabase.from('articles').delete().eq('id', e.target.dataset.delArticle);
            toast('已删除'); await loadArticles();
        }
    });

    $('#toggleCodeForm').addEventListener('click', () => $('#codeForm').classList.toggle('hidden'));
    $('#codeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = $('#codeName').value.trim(); const code = $('#codeBody').value.trim();
        if (!name || !code) return toast('不能为空');
        await supabase.from('codes').insert([{ id: genId(), name, code, created_at: fmtDate() }]);
        e.target.reset(); e.target.classList.add('hidden'); toast('保存成功'); await loadCodes();
    });

    $('#toggleArticleForm').addEventListener('click', () => $('#articleForm').classList.toggle('hidden'));
    $('#articleForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const category = $('#articleCat').value; const title = $('#articleTitle').value.trim(); const content = $('#articleBody').value.trim();
        if (!title || !content) return toast('不能为空');
        await supabase.from('articles').insert([{ id: genId(), category, title, content, created_at: fmtDate() }]);
        e.target.reset(); e.target.classList.add('hidden'); toast('保存成功'); await loadArticles();
    });

    document.querySelectorAll('[data-cancel]').forEach(btn => {
        btn.addEventListener('click', () => { const form = document.getElementById(btn.dataset.cancel); form.reset(); form.classList.add('hidden'); });
    });

    /* ================= 初始化 ================= */
    (async function init() {
        const savedUid = localStorage.getItem('zari_uid');
        if (savedUid) {
            const { data } = await supabase.from('users').select('*').eq('uid', savedUid).single();
            if (data) { state.currentUser = data; enterMainApp(); return; }
        }
        $('#loginOverlay').classList.remove('hidden');
    })();
</script>
</body>
</html>
